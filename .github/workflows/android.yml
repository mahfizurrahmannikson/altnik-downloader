name: Build APK (online, no Android Studio needed)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: do NOT use android-actions/setup-android@v3 (it breaks sdkmanager).
      # ubuntu-latest already has Android SDK preinstalled — use it directly.
      - name: Install Android platform + build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Download Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip
          echo "$PWD/gradle-8.6/bin" >> $GITHUB_PATH

      # Files may be at repo root OR inside "InstaFB Downloader/" subfolder
      # (happens when the whole folder is drag-dropped into GitHub).
      # Detect the real project dir automatically.
      - name: Locate Gradle project
        run: |
          echo "=== repo root ==="; ls -la
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Found project at repo root"
          else
            DIR=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -1 | xargs dirname)
            if [ -z "$DIR" ]; then
              echo "ERROR: settings.gradle.kts not found anywhere! Check uploaded files."
              find . -maxdepth 3 | head -50
              exit 1
            fi
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
            echo "Found project at: $DIR"
            ls -la "$DIR"; ls -la "$DIR/app" || true
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altnik-downloader-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
